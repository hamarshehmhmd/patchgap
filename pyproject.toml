[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "patchgap"
version = "0.1.0"
description = "Find Linux hosts exposed to hot CVEs while your distro's fix lags, apply reversible stopgaps, and remove them once patched."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{name = "Mohammad Hamarsheh"}]
requires-python = ">=3.9"
dependencies = ["PyYAML>=5.1"]
keywords = ["cve", "linux", "kernel", "patch-management", "mitigation", "nftables", "security", "sysadmin"]
classifiers = [
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/hamarshehmhmd/patchgap"
Issues = "https://github.com/hamarshehmhmd/patchgap/issues"

[project.scripts]
patchgap = "patchgap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchgap = ["data/*.yaml"]
