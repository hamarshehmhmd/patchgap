mitigations:
- id: cve-2026-98432-nft
  cves:
  - CVE-2026-98432
  kind: nftables
  summary: Drop incoming IPv4 TCP packets that carry IP options (IHL > 5), before other rules.
  table:
    family: inet
    name: cve_2026_98432
  ruleset: "table inet cve_2026_98432 {\n    chain input {\n        type filter hook input priority -310; policy\
    \ accept;\n        ip protocol tcp ip hdrlength > 5 counter drop\n    }\n}\n"
  requires:
  - nft
  breaks: TCP connections that depend on IPv4 options (rare on the public internet).
  limits: Reduces exposure but does not fully prevent exploitation (Red Hat). Containers or other network namespaces
    need the rule applied separately; eBPF/XDP paths can bypass netfilter. The Ubuntu security team's blog says
    kernel updates are the only appropriate mitigation.
  sources:
  - https://access.redhat.com/security/vulnerabilities/RHSB-2026-016
  - https://ubuntu.com/security/CVE-2026-98432
  - https://ubuntu.com/blog/fixes-available-in-proposed-pocket-for-cve-2026-98432
- id: cve-2026-31431-algif-aead
  cves:
  - CVE-2026-31431
  kind: modprobe
  summary: Block the algif_aead module from loading and unload it if loaded.
  modules:
  - algif_aead
  kconfig: CONFIG_CRYPTO_USER_API_AEAD
  requires:
  - modprobe
  breaks: Userspace that explicitly uses AF_ALG AEAD sockets (e.g. OpenSSL afalg engine, some embedded offload).
    dm-crypt/LUKS, kTLS, IPsec and SSH are unaffected (copy.fail).
  limits: Does nothing if algif_aead is built into the kernel (CONFIG_CRYPTO_USER_API_AEAD=y, e.g. RHEL 9/10); patchgap
    refuses to apply it there. Did not stop the PoC under WSL2.
  sources:
  - https://copy.fail/
  - https://news.ycombinator.com/item?id=47952181
- id: cve-2024-6387-logingracetime
  cves:
  - CVE-2024-6387
  kind: sshd
  summary: Set 'LoginGraceTime 0' in an sshd_config.d drop-in and reload sshd.
  directives:
    LoginGraceTime: '0'
  requires:
  - sshd
  breaks: sshd no longer times out unauthenticated connections, so an attacker can exhaust MaxStartups (denial of
    service).
  limits: Needs an 'Include /etc/ssh/sshd_config.d/*.conf' line in sshd_config (Debian 12+, Ubuntu 22.04+).
  sources:
  - https://www.qualys.com/2024/07/01/cve-2024-6387/regresshion.txt
