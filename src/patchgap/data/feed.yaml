- id: CVE-2024-6387
  name: regreSSHion
  component: package
  binaries:
    deb:
    - openssh-server
    rpm:
    - openssh-server
  summary: Signal handler race in OpenSSH's sshd (8.5p1 to 9.7p1) that can give an unauthenticated remote attacker
    root code execution on glibc-based Linux.
  references:
  - https://www.qualys.com/2024/07/01/cve-2024-6387/regresshion.txt
  - https://security-tracker.debian.org/tracker/CVE-2024-6387
