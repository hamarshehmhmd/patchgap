# Hand-maintained part of the feed: which CVEs to track, which package names to look up
# on each tracker, and the interim mitigations. Fix status and versions are NOT kept here;
# scripts/build_feed.py fetches them from the trackers and records each source URL.
cves:
  - id: CVE-2026-98432
    name: null            # no catchy name in the advisories we read
    component: kernel
    summary: >-
      Linux kernel IPv4 TCP use-after-free (ip_options_build) reachable with crafted IPv4 TCP
      packets that carry IP options. Red Hat rates it Critical (CVSS 9.8); AWS says researchers
      demonstrated unauthenticated RCE against hosts with an MPTCP listener.
    references:
      - https://security-tracker.debian.org/tracker/CVE-2026-98432
      - https://ubuntu.com/security/CVE-2026-98432
      - https://ubuntu.com/blog/fixes-available-in-proposed-pocket-for-cve-2026-98432
      - https://access.redhat.com/security/vulnerabilities/RHSB-2026-016
      - https://aws.amazon.com/security/security-bulletins/2026-160-aws/
      - https://explore.alas.aws.amazon.com/CVE-2026-98432.html
      - https://git.kernel.org/linus/e3f33b0a1d89d738e2b913dab519226eaf76e15b
      - https://news.ycombinator.com/item?id=50337608
      - https://news.ycombinator.com/item?id=50341462
    mitigations: [cve-2026-98432-nft]
    packages:
      debian: [linux, linux-6.1, linux-6.12]
      ubuntu: ['linux', 'linux-.+']
      rhel: [kernel]
      amzn: [kernel, kernel6.12, kernel6.18]

  - id: CVE-2026-31431
    name: Copy Fail
    component: kernel
    summary: >-
      Linux kernel algif_aead (AF_ALG) bug that lets an unprivileged local user write to the
      page cache of files they can read, e.g. a setuid binary, and become root.
    references:
      - https://copy.fail/
      - https://security-tracker.debian.org/tracker/CVE-2026-31431
      - https://ubuntu.com/security/CVE-2026-31431
      - https://access.redhat.com/security/cve/CVE-2026-31431
      - https://git.kernel.org/linus/a664bf3d603dc3bdcf9ae47cc21e0daec706d7a5
      - https://news.ycombinator.com/item?id=47952181
    mitigations: [cve-2026-31431-algif-aead]
    packages:
      debian: [linux, linux-6.1, linux-6.12]
      ubuntu: ['linux', 'linux-.+']
      rhel: [kernel]
      amzn: [kernel, kernel6.12, kernel6.18]

  - id: CVE-2024-6387
    name: regreSSHion
    component: package
    binaries: {deb: [openssh-server], rpm: [openssh-server]}
    summary: >-
      Signal handler race in OpenSSH's sshd (8.5p1 to 9.7p1) that can give an unauthenticated
      remote attacker root code execution on glibc-based Linux.
    references:
      - https://www.qualys.com/2024/07/01/cve-2024-6387/regresshion.txt
      - https://security-tracker.debian.org/tracker/CVE-2024-6387
      - https://ubuntu.com/security/CVE-2024-6387
      - https://access.redhat.com/security/cve/CVE-2024-6387
      - https://news.ycombinator.com/item?id=40843778
    mitigations: [cve-2024-6387-logingracetime]
    packages:
      debian: [openssh]
      ubuntu: [openssh]
      rhel: [openssh]
      amzn: [openssh]

mitigations:
  - id: cve-2026-98432-nft
    cves: [CVE-2026-98432]
    kind: nftables
    summary: Drop incoming IPv4 TCP packets that carry IP options (IHL > 5), before other rules.
    table: {family: inet, name: cve_2026_98432}
    ruleset: |
      table inet cve_2026_98432 {
          chain input {
              type filter hook input priority -310; policy accept;
              ip protocol tcp ip hdrlength > 5 counter drop
          }
      }
    requires: [nft]
    breaks: TCP connections that depend on IPv4 options (rare on the public internet).
    limits: >-
      Reduces exposure but does not fully prevent exploitation (Red Hat). Containers or other
      network namespaces need the rule applied separately; eBPF/XDP paths can bypass netfilter.
      The Ubuntu security team's blog says kernel updates are the only appropriate mitigation.
    sources:
      - https://access.redhat.com/security/vulnerabilities/RHSB-2026-016
      - https://ubuntu.com/security/CVE-2026-98432
      - https://ubuntu.com/blog/fixes-available-in-proposed-pocket-for-cve-2026-98432

  - id: cve-2026-31431-algif-aead
    cves: [CVE-2026-31431]
    kind: modprobe
    summary: Block the algif_aead module from loading and unload it if loaded.
    modules: [algif_aead]
    kconfig: CONFIG_CRYPTO_USER_API_AEAD
    requires: [modprobe]
    breaks: >-
      Userspace that explicitly uses AF_ALG AEAD sockets (e.g. OpenSSL afalg engine, some
      embedded offload). dm-crypt/LUKS, kTLS, IPsec and SSH are unaffected (copy.fail).
    limits: >-
      Does nothing if algif_aead is built into the kernel (CONFIG_CRYPTO_USER_API_AEAD=y, e.g.
      RHEL 9/10); patchgap refuses to apply it there. Did not stop the PoC under WSL2.
    sources:
      - https://copy.fail/
      - https://news.ycombinator.com/item?id=47952181

  - id: cve-2024-6387-logingracetime
    cves: [CVE-2024-6387]
    kind: sshd
    summary: Set 'LoginGraceTime 0' in an sshd_config.d drop-in and reload sshd.
    directives: {LoginGraceTime: "0"}
    requires: [sshd]
    breaks: >-
      sshd no longer times out unauthenticated connections, so an attacker can exhaust
      MaxStartups (denial of service).
    limits: Needs an 'Include /etc/ssh/sshd_config.d/*.conf' line in sshd_config (Debian 12+, Ubuntu 22.04+).
    sources:
      - https://www.qualys.com/2024/07/01/cve-2024-6387/regresshion.txt
